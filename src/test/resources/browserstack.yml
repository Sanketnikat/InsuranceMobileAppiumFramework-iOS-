userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

framework: testng

platforms:

  # ==========================================
  # iOS - Lower End / Older Device
  # ==========================================
  - platformName: ios
    deviceName: iPhone 13
    platformVersion: "18"
    app: ${BROWSERSTACK_IOS_APP}

  # ==========================================
  # iOS - High End / Flagship
  # ==========================================
  - platformName: ios
    deviceName: iPhone 17 Pro
    platformVersion: "26"
    app: ${BROWSERSTACK_IOS_APP}

  # ==========================================
  # Android - Lower End / Older Device
  # ==========================================
  - platformName: android
    deviceName: Samsung Galaxy M32
    platformVersion: "11.0"
    app: ${BROWSERSTACK_ANDROID_APP}

  # ==========================================
  # Android - High End / Flagship
  # ==========================================
  - platformName: android
    deviceName: Samsung Galaxy S24 Ultra
    platformVersion: "14.0"
    app: ${BROWSERSTACK_ANDROID_APP}

# ==========================================
# BrowserStack Configuration
# ==========================================

browserstackLocal: false

buildName: "Bima Sugam Mobile Build"
projectName: "Insurance Mobile Appium Framework"

debug: true
networkLogs: true
video: true
deviceLogs: true

testObservability: true