userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

framework: testng

# ==========================================
# PROJECT
# ==========================================

projectName: "Bima-Sugam-Mobile"

# ==========================================
# SPRINT
# ==========================================

buildName: "${BSTACK_BUILD_NAME}"
buildTag: "${BSTACK_BUILD_TAG}"

# ==========================================
# 4 PARALLEL DEVICES
# ==========================================

platforms:

  # iOS - Older
  - platformName: ios
    deviceName: iPhone 13
    platformVersion: "18"

  # iOS - Flagship
  - platformName: ios
    deviceName: iPhone 17 Pro
    platformVersion: "26"

  # Android - Older
  - platformName: android
    deviceName: Samsung Galaxy M32
    platformVersion: "11.0"

  # Android - Flagship
  - platformName: android
    deviceName: Samsung Galaxy S24 Ultra
    platformVersion: "14.0"

# ==========================================
# BROWSERSTACK SETTINGS
# ==========================================

browserstackLocal: true

browserStackLocalOptions:
  forcelocal: true

debug: true
networkLogs: true
video: true
deviceLogs: true
testObservability: true