# =========================
# Application
# =========================
app.path=apps/InsuranceApp.apk
app.package=com.example.insurance
app.activity=com.example.insurance.MainActivity

# =========================
# Appium
# =========================
appium.server=http://127.0.0.1:4723
platform=android

# emulator = use AVD / detected ADB device
# real     = use a connected physical Android device
deviceType=emulator
device.name=Pixel_9_Pro
platform.version=17
# device.udid=

# =========================
# Execution information
# =========================
environment=QA
build=1.0.0

# =========================
# Video
# =========================
video.enabled=true
video.max.seconds=180
